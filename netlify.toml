[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# CMS-driven + legacy-URL redirects (see the admin's "Redirects"
# section and supabase's `redirects` table): checked live on every
# request EXCEPT the ones explicitly excluded below — covers arbitrary
# legacy paths (not just /services/* and /pages/*), while keeping the
# homepage (most perf/LCP-sensitive route), the admin app, the API
# function rewrite, and static assets completely untouched by this
# lookup. See netlify/edge-functions/redirects.js.
[[edge_functions]]
  path = "/*"
  function = "redirects"
  excludedPath = [
    "/",
    "/admin/*",
    "/api/*",
    "/.netlify/*",
    "/assets/*",
    "/images/*",
    "/video/*",
    "/fonts/*",
    "/favicon.ico",
    "/apple-touch-icon.png",
    "/favicon-v2.ico",
    "/favicon-32x32-v2.png",
    "/favicon-16x16-v2.png",
    "/apple-touch-icon-v2.png",
    "/icon-192-v2.png",
    "/icon-512-v2.png",
    "/favicon-v3.ico",
    "/favicon-32x32-v3.png",
    "/favicon-16x16-v3.png",
    "/apple-touch-icon-v3.png",
    "/icon-192-v3.png",
    "/icon-512-v3.png",
    "/site.webmanifest",
    "/robots.txt",
    "/sitemap.xml",
  ]

# Frontend keeps calling /api/google-reviews — this rewrites it to the
# actual function path without changing the URL the browser sees.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# sitemap.xml is generated live from Supabase (see
# netlify/functions/sitemap.js) so newly published SEO pages/services
# appear without a rebuild. force=true so this wins over the static
# public/sitemap.xml file that ships in the build.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# Legacy TorontoBuffing.com 301 Permanent Redirects
# Maps old Webflow-era URLs to their corresponding destinations on the
# current site. Must all come before the SPA fallback rule at the very
# end of this file — Netlify uses the first matching redirect, so the
# fallback would otherwise swallow every one of these as a 200 instead
# of a real 301.
[[redirects]]
  from = "/home.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/photos.html"
  to = "/#work"
  status = 301
  force = true

