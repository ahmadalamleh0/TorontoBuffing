# SPA fallback for react-router client-side routes. Must come after
# every rule above — Netlify uses the first matching redirect. Only
# ever matches paths not covered by any rule above, and the app itself
# renders a real 404 page (NotFoundPage) client-side for any unknown
# route, so an unmapped legacy or made-up URL never silently lands on
# the homepage.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

